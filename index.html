<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CyberLembretes</title>
  
  <link rel="manifest" href="manifest.json">
  <script src="onesignal.js" async></script>
  
  <style>
    :root {
      --bg-color: #080b11;
      --card-bg: rgba(18, 26, 43, 0.65);
      --card-border: rgba(0, 240, 255, 0.18);
      --neon-cyan: #00f0ff;
      --neon-green: #00ff88;
      --neon-red: #ff2a6d;
      --text-main: #e0f7fc;
      --text-sub: #788ca0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: calc(env(safe-area-inset-top, 59px) + 12px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
      padding-left: 16px;
      padding-right: 16px;
      overflow-x: hidden;
    }

    /* Ajuste para Ilha Dinâmica do iPhone 14 Pro */
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 240, 255, 0.08);
      margin-bottom: 16px;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #ffffff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.72rem;
      color: var(--text-sub);
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Card de Criação */
    .create-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-text {
      width: 100%;
      background: rgba(5, 10, 20, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.3s;
    }

    .input-text:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    .time-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    .toggle-label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .3s;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: rgba(0, 240, 255, 0.2);
      border-color: var(--neon-cyan);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    .datetime-input {
      width: 100%;
      background: rgba(5, 10, 20, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 10px;
      color: var(--neon-cyan);
      font-size: 0.9rem;
      outline: none;
      display: none;
    }

    .datetime-input.active {
      display: block;
    }

    .btn-add {
      background: linear-gradient(135deg, rgba(0,240,255,0.2), rgba(0,255,136,0.2));
      border: 1px solid var(--neon-cyan);
      color: #fff;
      padding: 12px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-add:active {
      transform: scale(0.98);
      background: var(--neon-cyan);
      color: #000;
    }

    /* Lista de Lembretes */
    .reminder-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .reminder-item {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reminder-item.completed {
      border-color: rgba(0, 255, 136, 0.4);
      opacity: 0.65;
    }

    .reminder-item.completed .reminder-title {
      text-decoration: line-through;
      color: var(--neon-green);
    }

    .reminder-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      padding-right: 12px;
    }

    .reminder-title {
      font-size: 0.95rem;
      font-weight: 500;
      word-break: break-word;
    }

    .reminder-time {
      font-size: 0.72rem;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-action:active { transform: scale(0.88); }

    .btn-check {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
    }

    .btn-delete {
      background: rgba(255, 42, 109, 0.15);
      border: 1px solid var(--neon-red);
      color: var(--neon-red);
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-info">
      <img src="logo.jpg" alt="Logo" class="logo">
      <div>
        <div class="title">CYBER REMIND</div>
        <div class="subtitle">Auto-expira em 24h</div>
      </div>
    </div>
  </div>

  <div class="app-container">
    <div class="create-card">
      <input type="text" id="reminderText" class="input-text" placeholder="Escreva seu lembrete...">
      
      <div class="time-toggle-row">
        <span class="toggle-label">Ativar Horário Específico</span>
        <label class="switch">
          <input type="checkbox" id="timeToggle" onchange="toggleTimePicker()">
          <span class="slider"></span>
        </label>
      </div>

      <input type="datetime-local" id="reminderTime" class="datetime-input">

      <button class="btn-add" onclick="addReminder()">+ Adicionar</button>
    </div>

    <div id="reminderList" class="reminder-list">
      <div class="empty-state">Sincronizando com a nuvem...</div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvhy1539xd8I_Iuke5Ja7hbHtVtZ6iaU4q-beZ0vDD9BGEzhS-y06jakx1Vrlmae0/exec';

    // Inicialização do OneSignal
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "SEU_ONESIGNAL_APP_ID_AQUI",
      });
    });

    // Registra Service Worker PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    function toggleTimePicker() {
      const toggle = document.getElementById('timeToggle');
      const timeInput = document.getElementById('reminderTime');
      timeInput.classList.toggle('active', toggle.checked);
    }

    async function loadReminders() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        renderReminders(data);
      } catch (err) {
        document.getElementById('reminderList').innerHTML = 
          '<div class="empty-state">Erro ao carregar lembretes.</div>';
      }
    }

    function renderReminders(list) {
      const container = document.getElementById('reminderList');
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhum lembrete ativo no momento.</div>';
        return;
      }

      container.innerHTML = list.map(item => {
        const isTimeActive = item.ativarHorario && item.horarioAgendado;
        const formattedTime = isTimeActive ? new Date(item.horarioAgendado).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';

        return `
          <div class="reminder-item ${item.concluido ? 'completed' : ''}" id="${item.id}">
            <div class="reminder-content">
              <span class="reminder-title">${escapeHtml(item.texto)}</span>
              ${isTimeActive ? `<span class="reminder-time">⏰ ${formattedTime}</span>` : ''}
            </div>
            <div class="actions">
              <button class="btn-action btn-check" onclick="toggleComplete('${item.id}')">✓</button>
              <button class="btn-action btn-delete" onclick="deleteReminder('${item.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function addReminder() {
      const textInput = document.getElementById('reminderText');
      const toggle = document.getElementById('timeToggle');
      const timeInput = document.getElementById('reminderTime');

      if (!textInput.value.trim()) return;

      const payload = {
        action: 'ADD',
        texto: textInput.value.trim(),
        ativarHorario: toggle.checked,
        horarioAgendado: toggle.checked ? timeInput.value : null
      };

      textInput.value = '';
      toggle.checked = false;
      toggleTimePicker();

      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      setTimeout(loadReminders, 1000);
    }

    async function toggleComplete(id) {
      const elem = document.getElementById(id);
      if (elem) elem.classList.toggle('completed');

      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'TOGGLE_COMPLETE', id: id })
      });
    }

    async function deleteReminder(id) {
      const elem = document.getElementById(id);
      if (elem) elem.remove();

      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'DELETE', id: id })
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    loadReminders();
    setInterval(loadReminders, 30000);
  </script>
</body>
</html>
