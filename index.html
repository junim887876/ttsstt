<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Comprovantes 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.jpg">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    :root {
      --primary: #007aff;
      --primary-gradient: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
      --accent-green: #34c759;
      --accent-purple: #af52de;
      --danger: #ff3b30;
      
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-solid: #ffffff;
      --text: #000000;
      --text-secondary: #8e8e93;
      --border: rgba(60, 60, 67, 0.12);
      --glass-blur: blur(25px) saturate(180%);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      --search-bg: rgba(118, 118, 128, 0.12);
    }

    body.theme-dark {
      --bg: #000000 !important;
      --card-bg: rgba(28, 28, 30, 0.78) !important;
      --card-solid: #1c1c1e !important;
      --text: #ffffff !important;
      --text-secondary: #98989d !important;
      --border: rgba(255, 255, 255, 0.15) !important;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
      --search-bg: rgba(118, 118, 128, 0.24) !important;
    }

    body.theme-light {
      --bg: #f2f2f7 !important;
      --card-bg: rgba(255, 255, 255, 0.82) !important;
      --card-solid: #ffffff !important;
      --text: #000000 !important;
      --text-secondary: #8e8e93 !important;
      --border: rgba(60, 60, 67, 0.12) !important;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
      --search-bg: rgba(118, 118, 128, 0.12) !important;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-top: max(env(safe-area-inset-top), 24px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 95px);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      padding: 0 20px;
      max-width: 440px;
      margin: 0 auto;
    }

    header {
      padding: 12px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 0.5px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .tab-content {
      display: none;
      animation: iosSpring 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }

    .tab-content.active {
      display: block;
    }

    @keyframes iosSpring {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 14px;
    }

    .search-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: var(--search-bg);
      border: none;
      border-radius: 16px;
      font-size: 17px;
      outline: none;
      color: var(--text);
    }

    .search-wrapper .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      opacity: 0.4;
    }

    .chips-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 6px;
      scrollbar-width: none;
    }
    .chips-wrapper::-webkit-scrollbar { display: none; }

    .subchips-wrapper {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .subchips-wrapper::-webkit-scrollbar { display: none; }

    .chip {
      background: var(--card-solid);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      border: 0.5px solid var(--border);
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--primary-gradient);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .subchip {
      background: rgba(118, 118, 128, 0.12);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border: none;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .subchip.active {
      background: var(--text);
      color: var(--bg);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
      border: 0.5px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-stripe {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 6px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      padding-left: 6px;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--primary-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
    }

    .card-meta h3 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .card-meta p {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .badges-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .cat-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      color: white;
      text-transform: uppercase;
    }

    .subcat-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(118, 118, 128, 0.18);
      color: var(--text);
      text-transform: uppercase;
    }

    .card-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }

    .btn-action {
      background: rgba(118, 118, 128, 0.12);
      color: var(--text);
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action.primary {
      background: var(--primary-gradient);
      color: white;
    }

    .btn-action.whatsapp {
      background: rgba(52, 199, 89, 0.15);
      color: var(--accent-green);
    }

    .btn-action.danger {
      background: rgba(255, 59, 48, 0.12);
      color: var(--danger);
      padding: 10px 14px;
    }

    .section-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 24px;
      padding: 20px;
      border: 0.5px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .dropzone {
      border: 2px dashed rgba(0, 122, 255, 0.4);
      background: rgba(0, 122, 255, 0.04);
      border-radius: 20px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
    }

    .dropzone-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      margin-top: 8px;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #af52de 0%, #007aff 100%);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .form-field {
      margin-top: 14px;
    }

    .form-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-field input, .form-field select {
      width: 100%;
      padding: 14px;
      background: var(--search-bg);
      border: none;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      color: var(--text);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      margin-top: 18px;
      box-shadow: 0 6px 20px rgba(0, 122, 255, 0.35);
      cursor: pointer;
    }

    /* MODAL DE VISUALIZAÇÃO LIMPO E NÍTIDO (SEM MARCA D'ÁGUA OU SOMBRAS) */
    .pdf-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000000;
      z-index: 1000;
      display: none;
      flex-direction: column;
      animation: modalFade 0.2s ease-out;
    }

    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .pdf-modal-header {
      padding: max(env(safe-area-inset-top), 12px) 16px 12px;
      background: var(--card-solid);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--border);
    }

    .pdf-modal-header h3 {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-zoom {
      background: rgba(118, 118, 128, 0.2);
      border: none;
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-close-modal {
      background: rgba(255, 59, 48, 0.15);
      color: var(--danger);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 8px;
    }

    .pdf-modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 5px;
      touch-action: pan-x pan-y pinch-zoom;
      -webkit-overflow-scrolling: touch;
    }

    /* Canvas sem filtros ou sombras pesadas para manter clareza total */
    #pdfCanvas {
      background: #ffffff;
      border-radius: 4px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .ai-loader {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: var(--accent-purple);
      font-weight: 600;
      margin-top: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(175, 82, 222, 0.2);
      border-top-color: var(--accent-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .cat-item {
      padding: 12px;
      background: var(--search-bg);
      border-radius: 14px;
      margin-bottom: 10px;
    }

    .cat-item-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
    }

    .subcat-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 0.5px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .subcat-tag {
      font-size: 11px;
      background: var(--card-solid);
      padding: 4px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-bar {
      position: fixed;
      bottom: max(env(safe-area-inset-bottom), 14px);
      left: 20px;
      right: 20px;
      max-width: 400px;
      margin: 0 auto;
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 0.5px solid var(--border);
      border-radius: 32px;
      display: flex;
      justify-content: space-around;
      padding: 8px 12px;
      box-shadow: var(--shadow);
    }

    .tab-item {
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      gap: 3px;
      width: 30%;
      padding: 4px 0;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .tab-item.active { color: var(--primary); }
    .tab-item .icon { font-size: 20px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 id="pageTitle">Documentos</h1>
    </div>
    <button class="theme-toggle-btn" onclick="alternarTemaManual()" id="themeBtn">🌙</button>
  </header>

  <div class="container">
    
    <!-- ABA 1: Documentos e Busca -->
    <section id="tab-search" class="tab-content active">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Pesquisar documento..." oninput="buscarDoc()">
      </div>

      <div class="chips-wrapper" id="chipsContainer">
        <button class="chip active" onclick="filtrarCategoria(this, '')">Todos</button>
      </div>

      <div class="subchips-wrapper" id="subchipsContainer" style="display: none;"></div>

      <div id="lista"></div>
    </section>

    <!-- ABA 2: Upload -->
    <section id="tab-upload" class="tab-content">
      <div class="section-card">
        <div class="dropzone" onclick="document.getElementById('fileInput').click()">
          <span style="font-size: 38px;">📄 / 🖼️</span>
          <div class="dropzone-text" id="fileName">Toque para selecionar PDF ou Foto</div>
          <div class="ai-badge">✨ Auto-Nome por IA</div>
        </div>
        <input type="file" id="fileInput" accept="application/pdf, image/png, image/jpeg, image/jpg, image/webp" style="display: none;" onchange="processarArquivoIA()">

        <div class="ai-loader" id="aiLoader">
          <div class="spinner"></div>
          <span>IA lendo arquivo offline...</span>
        </div>

        <div class="form-field">
          <label>Nome do Documento</label>
          <input type="text" id="docName" placeholder="Ex: IPVA 2026 Hilux">
        </div>

        <div class="form-field">
          <label>Categoria Principal</label>
          <select id="docCategorySelect" onchange="atualizarSelectSubcategorias()">
            <option value="Geral">Geral</option>
          </select>
        </div>

        <div class="form-field">
          <label>Subcategoria</label>
          <select id="docSubCategorySelect">
            <option value="Geral">Geral</option>
          </select>
        </div>

        <button class="btn-submit" onclick="salvarDoc()">Salvar no iPhone</button>
      </div>
    </section>

    <!-- ABA 3: Opções -->
    <section id="tab-tools" class="tab-content">
      <div class="section-card">
        <h3 style="margin-bottom: 8px;">🏷️ Nova Categoria Principal</h3>
        <div class="form-field" style="margin-top: 0;">
          <input type="text" id="newCatName" placeholder="Ex: Hilux, Moto, Pessoal">
        </div>
        <button class="btn-submit" style="margin-top: 10px; padding: 12px;" onclick="criarCategoria()">Criar Categoria</button>
      </div>

      <div class="section-card">
        <h3 style="margin-bottom: 8px;">📂 Nova Subcategoria</h3>
        <div class="form-field" style="margin-top: 0;">
          <label>Selecione a Categoria Pai</label>
          <select id="parentCategorySelect"></select>
        </div>
        <div class="form-field">
          <input type="text" id="newSubCatName" placeholder="Ex: IPVA, Seguro, Revisão">
        </div>
        <button class="btn-submit" style="margin-top: 10px; padding: 12px; background: linear-gradient(135deg, #34c759 0%, #007aff 100%);" onclick="criarSubCategoria()">Adicionar Subcategoria</button>
      </div>

      <div class="section-card">
        <h3 style="margin-bottom: 12px;">📋 Minhas Categorias</h3>
        <div id="listaCategoriasGerenciador"></div>
      </div>

      <div class="section-card">
        <h3 style="margin-bottom: 6px;">📄 PDF Unificado (Dossiê)</h3>
        <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 14px;">
          Junte todos os seus comprovantes em um único PDF.
        </p>
        <button class="btn-submit" style="background: linear-gradient(135deg, #af52de 0%, #007aff 100%);" onclick="gerarPDFUnificado()">Juntar & Exportar PDF Único</button>
      </div>

      <div class="section-card">
        <h3 style="margin-bottom: 6px;">⚙️ Backup dos Dados</h3>
        <button class="btn-action primary" style="width: 100%; padding: 14px; margin-bottom: 8px;" onclick="exportarBackup()">Exportar Backup (.json)</button>
        <input type="file" id="backupInput" accept=".json" style="display: none;" onchange="importarBackup(this)">
        <button class="btn-action" style="width: 100%; padding: 14px;" onclick="document.getElementById('backupInput').click()">Restaurar Backup</button>
      </div>
    </section>

  </div>

  <!-- Modal Visualizador com Canvas Nítido -->
  <div class="pdf-modal" id="pdfModal">
    <div class="pdf-modal-header">
      <h3 id="modalTitle">Documento</h3>
      <div class="zoom-controls">
        <button class="btn-zoom" onclick="alterarZoom(-0.15)">➖</button>
        <button class="btn-zoom" onclick="resetarZoom()">Ajustar</button>
        <button class="btn-zoom" onclick="alterarZoom(0.15)">➕</button>
        <button class="btn-close-modal" onclick="fecharModal()">✕</button>
      </div>
    </div>
    <div class="pdf-modal-body" id="modalBody">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <nav class="tab-bar">
    <button class="tab-item active" onclick="switchTab('search', 'Documentos', this)">
      <span class="icon">📁</span>
      <span>Documentos</span>
    </button>
    <button class="tab-item" onclick="switchTab('upload', 'Adicionar', this)">
      <span class="icon">➕</span>
      <span>Adicionar</span>
    </button>
    <button class="tab-item" onclick="switchTab('tools', 'Opções', this)">
      <span class="icon">⚙️</span>
      <span>Opções</span>
    </button>
  </nav>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';

    const CORES_DISPONIVEIS = ['#007aff', '#ff9500', '#34c759', '#af52de', '#ff2d55', '#5856d6', '#00c7be', '#ff3b30'];

    let categorias = JSON.parse(localStorage.getItem('minhas_categorias_v2')) || [
      { nome: 'Geral', cor: '#007aff', subcategorias: ['Geral'] }
    ];

    let categoriaFiltroAtiva = "";
    let subcategoriaFiltroAtiva = "";

    let currentPdfDoc = null;
    let currentBlob = null;
    let currentScale = 0.85; // ZOOM PADRÃO AJUSTADO PARA CABER PERFEITAMENTE NA TELA

    let db;
    const request = indexedDB.open("ComprovantesDB_v2", 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore("docs", { keyPath: "id" });
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      verificarHorarioTema();
      atualizarInterfaceCategorias();
      listarDocs();
    };

    function verificarHorarioTema() {
      const hora = new Date().getHours();
      const body = document.body;
      const btn = document.getElementById("themeBtn");

      if (hora >= 6 && hora < 18) {
        body.classList.remove("theme-dark");
        body.classList.add("theme-light");
        btn.innerText = "☀️";
      } else {
        body.classList.remove("theme-light");
        body.classList.add("theme-dark");
        btn.innerText = "🌙";
      }
    }

    function alternarTemaManual() {
      const body = document.body;
      const btn = document.getElementById("themeBtn");
      
      if (body.classList.contains("theme-dark")) {
        body.classList.remove("theme-dark");
        body.classList.add("theme-light");
        btn.innerText = "☀️";
      } else {
        body.classList.remove("theme-light");
        body.classList.add("theme-dark");
        btn.innerText = "🌙";
      }
    }

    function switchTab(tab, title, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tab}`).classList.add('active');
      btn.classList.add('active');
      document.getElementById('pageTitle').innerText = title;
    }

    function atualizarInterfaceCategorias() {
      const containerChips = document.getElementById("chipsContainer");
      containerChips.innerHTML = `<button class="chip active" onclick="filtrarCategoria(this, '')">Todos</button>`;
      
      categorias.forEach(cat => {
        containerChips.innerHTML += `<button class="chip" onclick="filtrarCategoria(this, '${cat.nome}')">${cat.nome}</button>`;
      });

      const selectCat = document.getElementById("docCategorySelect");
      const selectParentCat = document.getElementById("parentCategorySelect");
      
      selectCat.innerHTML = "";
      selectParentCat.innerHTML = "";

      categorias.forEach(cat => {
        selectCat.innerHTML += `<option value="${cat.nome}">${cat.nome}</option>`;
        selectParentCat.innerHTML += `<option value="${cat.nome}">${cat.nome}</option>`;
      });

      atualizarSelectSubcategorias();

      const listaGerenciador = document.getElementById("listaCategoriasGerenciador");
      listaGerenciador.innerHTML = "";
      categorias.forEach((cat, index) => {
        const subsHTML = (cat.subcategorias || []).map((sub, subIndex) => 
          `<span class="subcat-tag">
            ${sub} 
            ${subIndex > 0 ? `<b style="color: var(--danger); cursor: pointer;" onclick="deletarSubCategoria(${index},${subIndex})">✕</b>` : ''}
          </span>`
        ).join("");

        listaGerenciador.innerHTML += `
          <div class="cat-item">
            <div class="cat-item-main">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 12px; height: 12px; border-radius: 50%; background: ${cat.cor};"></div>
                <span>${cat.nome}</span>
              </div>
              ${index > 0 ? `<button class="btn-action danger" style="padding: 4px 8px; font-size: 11px;" onclick="deletarCategoria(${index})">Deletar</button>` : `<span style="font-size: 11px; color: var(--text-secondary);">Padrão</span>`}
            </div>
            <div class="subcat-list">${subsHTML}</div>
          </div>`;
      });

      localStorage.setItem('minhas_categorias_v2', JSON.stringify(categorias));
    }

    function atualizarSelectSubcategorias() {
      const catNome = document.getElementById("docCategorySelect").value;
      const cat = categorias.find(c => c.nome === catNome);
      const selectSub = document.getElementById("docSubCategorySelect");
      selectSub.innerHTML = "";

      const subs = cat ? (cat.subcategorias || ['Geral']) : ['Geral'];
      subs.forEach(sub => {
        selectSub.innerHTML += `<option value="${sub}">${sub}</option>`;
      });
    }

    function criarCategoria() {
      const input = document.getElementById("newCatName");
      const nome = input.value.trim();
      if (!nome) return alert("Digite um nome para a categoria!");

      const cor = CORES_DISPONIVEIS[categorias.length % CORES_DISPONIVEIS.length];
      categorias.push({ nome: nome, cor: cor, subcategorias: ['Geral'] });
      input.value = "";
      
      atualizarInterfaceCategorias();
      alert("Categoria criada!");
    }

    function criarSubCategoria() {
      const parentName = document.getElementById("parentCategorySelect").value;
      const subInput = document.getElementById("newSubCatName");
      const subNome = subInput.value.trim();

      if (!subNome) return alert("Digite um nome para a subcategoria!");

      const cat = categorias.find(c => c.nome === parentName);
      if (cat) {
        if (!cat.subcategorias) cat.subcategorias = ['Geral'];
        if (cat.subcategorias.includes(subNome)) return alert("Subcategoria já existe!");

        cat.subcategorias.push(subNome);
        subInput.value = "";
        atualizarInterfaceCategorias();
        alert("Subcategoria adicionada!");
      }
    }

    function deletarCategoria(index) {
      if (confirm(`Deseja apagar a categoria "${categorias[index].nome}"?`)) {
        categorias.splice(index, 1);
        atualizarInterfaceCategorias();
        listarDocs();
      }
    }

    function deletarSubCategoria(catIndex, subIndex) {
      if (confirm(`Apagar a subcategoria "${categorias[catIndex].subcategorias[subIndex]}"?`)) {
        categorias[catIndex].subcategorias.splice(subIndex, 1);
        atualizarInterfaceCategorias();
        listarDocs();
      }
    }

    function obterCorCategoria(nomeCat) {
      const cat = categorias.find(c => c.nome.toLowerCase() === (nomeCat || "").toLowerCase());
      return cat ? cat.cor : '#007aff';
    }

    function filtrarCategoria(el, catNome) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');

      categoriaFiltroAtiva = catNome;
      subcategoriaFiltroAtiva = "";

      const subContainer = document.getElementById("subchipsContainer");
      if (!catNome) {
        subContainer.style.display = "none";
      } else {
        const cat = categorias.find(c => c.nome === catNome);
        const subs = cat ? (cat.subcategorias || ['Geral']) : [];

        subContainer.innerHTML = `<button class="subchip active" onclick="filtrarSubcategoria(this, '')">Todas de ${catNome}</button>`;
        subs.forEach(sub => {
          subContainer.innerHTML += `<button class="subchip" onclick="filtrarSubcategoria(this, '${sub}')">${sub}</button>`;
        });
        subContainer.style.display = "flex";
      }

      listarDocs();
    }

    function filtrarSubcategoria(el, subNome) {
      document.querySelectorAll('.subchip').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      subcategoriaFiltroAtiva = subNome;
      listarDocs();
    }
