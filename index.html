<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Meus Comprovantes</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #000000;
      --text-secondary: #8e8e93;
      --border: #e5e5ea;
      --danger: #ff3b30;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
      min-height: 100vh;
    }

    .container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      padding: 12px 16px 8px;
    }

    header h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Sistema de Abas */
    .tab-content {
      display: none;
      animation: fadeIn 0.25s ease-in-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Barra de Busca estilo iOS */
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      background: #e3e3e8;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
      color: var(--text);
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      opacity: 0.5;
    }

    /* Cards de Documento */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .card-icon {
      font-size: 28px;
      background: #e1f0ff;
      padding: 10px;
      border-radius: 10px;
    }

    .card-details h3 {
      font-size: 17px;
      font-weight: 600;
      text-transform: capitalize;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .card-details p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .btn-view {
      background: #e1f0ff;
      color: var(--primary);
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }

    /* Formulário de Upload */
    .form-group {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .file-dropzone {
      border: 2px dashed var(--primary);
      background: #f0f7ff;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .file-dropzone p {
      font-size: 15px;
      color: var(--primary);
      font-weight: 600;
      margin-top: 8px;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }

    .btn-submit:active {
      opacity: 0.8;
    }

    /* Barra de Navegação Inferior estilo iOS */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding-top: 8px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tab-item {
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 500;
      gap: 4px;
      width: 50%;
    }

    .tab-item.active {
      color: var(--primary);
    }

    .tab-item span.icon {
      font-size: 22px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="pageTitle">Buscar</h1>
  </header>

  <div class="container">
    
    <!-- Aba de Busca e Lista -->
    <section id="tab-search" class="tab-content active">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar IPVA, CNH, CRLV..." oninput="buscarDoc()">
      </div>
      <div id="lista"></div>
    </section>

    <!-- Aba de Upload -->
    <section id="tab-upload" class="tab-content">
      <div class="form-group">
        <label>1. Selecionar Documento</label>
        <div class="file-dropzone" onclick="document.getElementById('fileInput').click()">
          <span style="font-size: 32px;">📄</span>
          <p id="fileName">Toque para escolher o PDF</p>
          <input type="file" id="fileInput" accept="application/pdf" style="display: none;" onchange="atualizarNomeArquivo()">
        </div>

        <label>2. Identificação</label>
        <input type="text" id="docName" placeholder="Ex: IPVA 2026 Hilux">
      </div>

      <button class="btn-submit" onclick="salvarDoc()">Salvar no iPhone</button>
    </section>

  </div>

  <!-- Tab Bar Nativa -->
  <nav class="tab-bar">
    <button class="tab-item active" onclick="switchTab('search', 'Buscar')">
      <span class="icon">🔍</span>
      <span>Documentos</span>
    </button>
    <button class="tab-item" onclick="switchTab('upload', 'Adicionar')">
      <span class="icon">➕</span>
      <span>Novo File</span>
    </button>
  </nav>

  <script>
    let db;
    const request = indexedDB.open("ComprovantesDB", 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore("docs", { keyPath: "nome" });
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      listarDocs();
    };

    function switchTab(tab, title) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tab}`).classList.add('active');
      event.currentTarget.classList.add('active');
      document.getElementById('pageTitle').innerText = title;
    }

    function atualizarNomeArquivo() {
      const file = document.getElementById("fileInput").files[0];
      if (file) {
        document.getElementById("fileName").innerText = file.name;
      }
    }

    function salvarDoc() {
      const file = document.getElementById("fileInput").files[0];
      const nome = document.getElementById("docName").value.trim();
      if (!file || !nome) return alert("Selecione um PDF e digite o nome!");

      const tx = db.transaction("docs", "readwrite");
      tx.objectStore("docs").put({ 
        nome: nome.toLowerCase(), 
        displayNome: nome, 
        blob: file,
        data: new Date().toLocaleDateString('pt-BR')
      });
      
      tx.oncomplete = () => {
        document.getElementById("docName").value = "";
        document.getElementById("fileInput").value = "";
        document.getElementById("fileName").innerText = "Toque para escolher o PDF";
        listarDocs();
        switchTab('search', 'Buscar');
      };
    }

    function listarDocs(filtro = "") {
      const lista = document.getElementById("lista");
      lista.innerHTML = "";
      let encontrou = false;

      const tx = db.transaction("docs", "readonly");
      tx.objectStore("docs").openCursor().onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          if (cursor.value.nome.includes(filtro.toLowerCase())) {
            encontrou = true;
            const url = URL.createObjectURL(cursor.value.blob);
            lista.innerHTML += `
              <div class="card">
                <div class="card-info">
                  <div class="card-icon">📄</div>
                  <div class="card-details">
                    <h3>${cursor.value.displayNome}</h3>
                    <p>Salvo em ${cursor.value.data || 'Offline'}</p>
                  </div>
                </div>
                <a href="${url}" target="_blank" class="btn-view">Abrir</a>
              </div>`;
          }
          cursor.continue();
        } else if (!encontrou) {
          lista.innerHTML = `
            <div class="empty-state">
              <span style="font-size: 40px;">📂</span>
              <p style="margin-top: 8px;">Nenhum comprovante encontrado.</p>
            </div>`;
        }
      };
    }

    function buscarDoc() {
      listarDocs(document.getElementById("searchInput").value);
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
