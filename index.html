<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lembrente</title>
  
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  
  <style>
    :root {
      --bg-dark: #000000;
      --glass-surface: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      
      --apple-cyan: #64D2FF;
      --apple-blue: #0A84FF;
      --apple-green: #30D158;
      --apple-red: #FF453A;
      
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-tertiary: rgba(255, 255, 255, 0.4);
      
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: calc(env(safe-area-inset-top, 59px) + 12px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 24px);
      padding-left: 18px;
      padding-right: 18px;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(10, 132, 255, 0.20) 0%, rgba(0,0,0,0) 80%);
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
    }

    .header-bar {
      width: 100%;
      max-width: 414px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--glass-surface);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      margin-bottom: 20px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--glass-border);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-status {
      font-size: 0.72rem;
      color: var(--apple-cyan);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--apple-green);
      box-shadow: 0 0 8px var(--apple-green);
    }

    .btn-notify {
      background: rgba(10, 132, 255, 0.15);
      border: 1px solid rgba(10, 132, 255, 0.4);
      color: var(--apple-cyan);
      padding: 7px 13px;
      border-radius: 18px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease-smooth);
    }

    .btn-notify:active {
      transform: scale(0.92);
      background: rgba(10, 132, 255, 0.3);
    }

    .app-viewport {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input-card {
      background: var(--glass-surface);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .custom-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      color: #FFF;
      font-size: 0.98rem;
      outline: none;
      transition: all 0.3s var(--ease-smooth);
    }

    .custom-input::placeholder {
      color: var(--text-tertiary);
    }

    .custom-input:focus {
      border-color: var(--apple-blue);
      background: rgba(0, 0, 0, 0.65);
      box-shadow: 0 0 16px rgba(10, 132, 255, 0.25);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
    }

    .toggle-title {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .toggle-sub {
      font-size: 0.73rem;
      color: var(--text-tertiary);
      display: block;
    }

    .ios-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 30px;
    }

    .ios-switch input { opacity: 0; width: 0; height: 0; }

    .switch-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: 0.3s var(--ease-smooth);
      border-radius: 30px;
    }

    .switch-slider:before {
      position: absolute;
      content: "";
      height: 26px; width: 26px;
      left: 2px; bottom: 2px;
      background-color: #FFFFFF;
      transition: 0.3s var(--ease-spring);
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }

    input:checked + .switch-slider {
      background-color: var(--apple-green);
    }

    input:checked + .switch-slider:before {
      transform: translateX(20px);
    }

    .date-picker-wrapper {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.35s var(--ease-smooth);
    }

    .date-picker-wrapper.open {
      max-height: 80px;
      opacity: 1;
      margin-top: 2px;
    }

    .custom-date-input {
      width: 100%;
      background: rgba(10, 132, 255, 0.1);
      border: 1px solid rgba(10, 132, 255, 0.3);
      border-radius: var(--radius-md);
      padding: 12px;
      color: var(--apple-cyan);
      font-size: 0.92rem;
      outline: none;
      color-scheme: dark;
    }

    .btn-create {
      background: linear-gradient(135deg, var(--apple-blue) 0%, #0056B3 100%);
      border: none;
      color: #FFFFFF;
      padding: 15px;
      border-radius: var(--radius-lg);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(10, 132, 255, 0.35);
      transition: all 0.2s var(--ease-smooth);
    }

    .btn-create:active { transform: scale(0.97); }

    .section-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .section-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .count-pill {
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--apple-cyan);
    }

    .reminders-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.3s var(--ease-smooth);
    }

    .task-card.completed {
      background: rgba(48, 209, 88, 0.05);
      border-color: rgba(48, 209, 88, 0.25);
      opacity: 0.55;
    }

    .task-card.completed .task-text {
      text-decoration: line-through;
      color: var(--text-tertiary);
    }

    .task-body {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      padding-right: 12px;
    }

    .task-text {
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.35;
      word-break: break-word;
    }

    .task-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.74rem;
      color: var(--apple-cyan);
      font-weight: 600;
      background: rgba(100, 210, 255, 0.1);
      padding: 3px 8px;
      border-radius: 8px;
      width: fit-content;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.2s var(--ease-spring);
    }

    .btn-icon:active { transform: scale(0.85); }

    .btn-success {
      background: rgba(48, 209, 88, 0.15);
      border: 1px solid rgba(48, 209, 88, 0.4);
      color: var(--apple-green);
    }

    .btn-danger {
      background: rgba(255, 69, 58, 0.15);
      border: 1px solid rgba(255, 69, 58, 0.4);
      color: var(--apple-red);
    }

    .empty-card {
      text-align: center;
      padding: 36px 20px;
      background: var(--glass-surface);
      border: 1px dashed var(--glass-border);
      border-radius: var(--radius-xl);
      color: var(--text-tertiary);
      font-size: 0.88rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #FFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <header class="header-bar">
    <div class="header-brand">
      <img src="logo.jpg" alt="Logo" class="logo-img">
      <div>
        <div class="brand-title">CYBER REMIND</div>
        <div class="brand-status">
          <span class="status-dot"></span> Planilha Ativa
        </div>
      </div>
    </div>
    <button class="btn-notify" onclick="requestNotificationPermission()">🔔 Notificações</button>
  </header>

  <main class="app-viewport">
    
    <div class="input-card">
      <input type="text" id="reminderText" class="custom-input" placeholder="Novo lembrete...">
      
      <div class="toggle-row">
        <div>
          <span class="toggle-title">Notificação Agendada</span>
          <span class="toggle-sub">Dispara no horário via Push</span>
        </div>
        <label class="ios-switch">
          <input type="checkbox" id="timeToggle" onchange="toggleTimePicker()">
          <span class="switch-slider"></span>
        </label>
      </div>

      <div id="datePickerWrapper" class="date-picker-wrapper">
        <input type="datetime-local" id="reminderTime" class="custom-date-input">
      </div>

      <button id="btnAdd" class="btn-create" onclick="addReminder()">
        <span>+ Criar Lembrete</span>
      </button>
    </div>

    <div class="section-meta">
      <span class="section-title">Lembretes</span>
      <span id="taskCount" class="count-pill">0 Ativos</span>
    </div>

    <div id="reminderList" class="reminders-feed">
      <div class="empty-card">
        <div class="spinner"></div>
        <span>Sincronizando com a nuvem...</span>
      </div>
    </div>

  </main>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby794-tvsb6axM_1kIBiiD8Sz_Tfe8rPsnRZp5Tz-DQBZ53Y9_qMyiZj-MdjanFRtUA/exec';
    const ONESIGNAL_APP_ID = 'caf77239-bdc5-4064-a19a-8c3b0fbd9258';

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
      });
    });

    async function requestNotificationPermission() {
      window.OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.Notifications.requestPermission();
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail:', err));
    }

    function toggleTimePicker() {
      const toggle = document.getElementById('timeToggle');
      const wrapper = document.getElementById('datePickerWrapper');
      wrapper.classList.toggle('open', toggle.checked);
    }

    async function loadReminders() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        renderReminders(data);
      } catch (err) {
        document.getElementById('reminderList').innerHTML = `
          <div class="empty-card">Erro ao carregar lembretes da planilha.</div>`;
      }
    }

    function renderReminders(list) {
      const container = document.getElementById('reminderList');
      const counter = document.getElementById('taskCount');

      if (!list || list.length === 0) {
        counter.textContent = '0 Ativos';
        container.innerHTML = `<div class="empty-card">Nenhum lembrete pendente.</div>`;
        return;
      }

      counter.textContent = `${list.length} ${list.length === 1 ? 'Ativo' : 'Ativos'}`;

      container.innerHTML = list.map(item => {
        const isTimeActive = item.ativarHorario && item.horarioAgendado;
        const formattedTime = isTimeActive ? new Date(item.horarioAgendado).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';

        return `
          <div class="task-card ${item.concluido ? 'completed' : ''}" id="${item.id}">
            <div class="task-body">
              <span class="task-text">${escapeHtml(item.texto)}</span>
              ${isTimeActive ? `<span class="task-time-badge">⏰ ${formattedTime}</span>` : ''}
            </div>
            <div class="task-actions">
              <button class="btn-icon btn-success" title="Concluir" onclick="toggleComplete('${item.id}')">✓</button>
              <button class="btn-icon btn-danger" title="Excluir" onclick="deleteReminder('${item.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function addReminder() {
      const textInput = document.getElementById('reminderText');
      const toggle = document.getElementById('timeToggle');
      const timeInput = document.getElementById('reminderTime');
      const btnAdd = document.getElementById('btnAdd');

      if (!textInput.value.trim()) return;

      const payload = {
        action: 'ADD',
        texto: textInput.value.trim(),
        ativarHorario: toggle.checked,
        horarioAgendado: toggle.checked ? timeInput.value : null
      };

      btnAdd.disabled = true;
      btnAdd.innerHTML = `<div class="spinner"></div><span>Salvando...</span>`;

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('Erro ao enviar:', e);
      }

      textInput.value = '';
      toggle.checked = false;
      toggleTimePicker();
      btnAdd.disabled = false;
      btnAdd.innerHTML = `<span>+ Criar Lembrete</span>`;

      setTimeout(loadReminders, 1200);
    }

    async function toggleComplete(id) {
      const card = document.getElementById(id);
      if (card) card.classList.toggle('completed');

      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'TOGGLE_COMPLETE', id: id })
      });
    }

    async function deleteReminder(id) {
      const card = document.getElementById(id);
      if (card) card.remove();

      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'DELETE', id: id })
      });
      
      setTimeout(loadReminders, 1000);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    loadReminders();
    setInterval(loadReminders, 25000);
  </script>
</body>
</html>
